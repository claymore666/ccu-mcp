name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo (build + test).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions pinned to a commit SHA (supply-chain hardening):
      # a retargeted mutable tag can't inject code into CI. Dependabot bumps
      # the SHA + comment together.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version sync check
        run: npm run check:versions

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
