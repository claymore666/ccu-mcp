version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the pin +
  # the version comment together, so pinning doesn't rot).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action's `init`, `analyze` and `upload-sarif` are one release
      # pinned at three paths, and `analyze` refuses to run against a config
      # written by a different `init` version ("Loaded a configuration file for
      # version '4.39.0', but running version '4.38.2'"). Proposed separately,
      # whichever lands first breaks CodeQL until the other follows: #288 and
      # #294 bumped `init` alone and every CodeQL run on dev failed from 14 to
      # 21 Oct, until #295 caught `analyze` up. One PR moves them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Dockerfile's base image. Now that the image is published rather than
  # built by whoever clones the repo, a stale `node:24-alpine` is something we
  # ship to users rather than something they pick up on their next local build.
  #
  # Patches yes, MAJORS no. A Node major is not a dependency bump, it is a
  # platform decision: it must move together with `engines`, `@types/node` and
  # every workflow's `node-version` (scripts/check-node-version.mjs enforces
  # that they agree). #169 auto-merged `node:24-alpine` -> `node:26-alpine`
  # unattended, and nothing in `build-and-test` builds the Dockerfile, so the
  # published image would have been the first thing to run that major. Moving
  # to a new major is one deliberate PR that touches all four places at once.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # npm deps: security + version updates against the committed lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @vitest/coverage-v8 peer-depends on the EXACT vitest version, so the
      # pair proposed as two PRs can never go green separately: whichever
      # lands first leaves the versions mismatched and the coverage ratchet in
      # `build-and-test` without a working provider. #225 and #227 (both to
      # 5.0.0) sat open for exactly that reason and had to be landed together
      # by hand. One PR moves them as the unit they already are.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # Same reasoning as the base image, from the other side: `@types/node`'s
      # major IS a Node major. Types from a newer major tell `tsc` that APIs
      # exist which the Node this project supports does not have, and the type
      # check is the only place that would notice. It moves with the platform
      # decision, not on its own schedule.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
