services:
  ccu-mcp:
    # Published multi-arch (linux/amd64 + linux/arm64) by the release workflow.
    # Swap for `build: .` to run this checkout instead of the released image.
    image: ghcr.io/claymore666/ccu-mcp:latest
    restart: unless-stopped
    volumes:
      - ccu-data:/data
    ports:
      - "3000:3000"
    environment:
      # === Required ===
      - CCU_HOST=192.168.x.x
      - CCU_PASSWORD=secret

      # === CCU connection (optional, defaults shown) ===
      # - CCU_PORT=80
      # - CCU_HTTPS=false
      # - CCU_USER=Admin

      # === Multiple CCU targets (optional; see README "Multiple CCU targets") ===
      # Named profiles instead of the flat CCU_* vars above. Per profile:
      # CCU_<NAME>_HOST/USER/PASSWORD/PORT/HTTPS/..., plus policy flags.
      # - CCU_PROFILES=prod,dev
      # - CCU_DEFAULT_PROFILE=prod
      # - CCU_PROD_HOST=192.168.x.x
      # - CCU_PROD_PASSWORD=secret
      # - CCU_PROD_PROTECTED=true   # writes need confirm:true (run_script/delete_system_variable: every call)
      # - CCU_DEV_HOST=192.168.x.y
      # - CCU_DEV_PASSWORD=secret2
      # - CCU_DEV_READONLY=false

      # === MCP transport (optional) ===
      # - MCP_TRANSPORT=http
      # - MCP_PORT=3000
      # - MCP_AUTH_TOKEN=           # auto-generated if unset
      # - MCP_ALLOWED_ORIGINS=      # comma-separated browser origin allowlist; unset = no cross-origin browser access (default-deny). Exact origin reflected, never '*'
      # - MCP_ALLOWED_HOSTS=        # extra Host values for DNS-rebinding protection (comma-separated host:port)

      # === Cache (optional) ===
      # - CACHE_DIR=/data
      # - CACHE_TTL=86400

      # === Timeouts (optional, milliseconds) ===
      # - CCU_TIMEOUT=10000
      # - CCU_SCRIPT_TIMEOUT=30000

      # === Rate limiting (optional) ===
      # - CCU_RATE_LIMIT_BURST=20
      # - CCU_RATE_LIMIT_RATE=10

      # === Resource polling (optional) ===
      # - RESOURCE_POLL_INTERVAL=60

      # === Logging (optional) ===
      # - LOG_LEVEL=info

volumes:
  ccu-data:
